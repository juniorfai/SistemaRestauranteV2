<div class="app-shell">
  <aside class="sidebar" aria-label="Menú principal">
    <a class="brand" routerLink="/reservas">
      <i class="bi bi-egg-fried" aria-hidden="true"></i>
      <span class="brand-name">Restaurante Master</span>
    </a>

    <nav class="nav-links">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link-item">
          <i class="bi {{ item.icon }}" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button" class="theme-toggle" (click)="theme.toggle()"
            [attr.aria-label]="isDark() ? 'Cambiar a modo día' : 'Cambiar a modo noche'">
      <i class="bi" [class.bi-sun]="isDark()" [class.bi-moon-stars]="!isDark()" aria-hidden="true"></i>
      <span>{{ isDark() ? 'Modo día' : 'Modo noche' }}</span>
    </button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
