<div class="mx-auto" style="max-width: 640px;">
  <div class="card">
    <div class="card-header">
      <h4>
        <i class="bi" [ngClass]="isEditMode ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
        {{ isEditMode ? 'Editar cliente' : 'Nuevo cliente' }}
      </h4>
    </div>
    <div class="card-body p-4">
      @if (error()) {
        <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}</div>
      }

      <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
        
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nombres</label>
            <input type="text" class="form-control" formControlName="firstName" 
                   [ngClass]="{'is-invalid': customerForm.get('firstName')?.touched && customerForm.get('firstName')?.invalid}">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Apellidos</label>
            <input type="text" class="form-control" formControlName="lastName"
                   [ngClass]="{'is-invalid': customerForm.get('lastName')?.touched && customerForm.get('lastName')?.invalid}">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" formControlName="email"
                     [ngClass]="{'is-invalid': customerForm.get('email')?.touched && customerForm.get('email')?.invalid}">
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Número de Teléfono</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-telephone"></i></span>
              <input type="text" class="form-control" formControlName="phoneNumber"
                     [ngClass]="{'is-invalid': customerForm.get('phoneNumber')?.touched && customerForm.get('phoneNumber')?.invalid}">
            </div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Preferencias / Notas Especiales <span class="text-muted">(Opcional)</span></label>
            <textarea class="form-control" rows="3" formControlName="preferences" placeholder="Ej: Alergias, mesa favorita..."></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a routerLink="/clientes" class="btn btn-outline-secondary px-4">Cancelar</a>
          <button type="submit" class="btn btn-primary px-4" [disabled]="saving()">
            <i class="bi bi-save me-2"></i>Guardar Cambios
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
