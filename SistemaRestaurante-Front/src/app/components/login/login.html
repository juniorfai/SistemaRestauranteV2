<div class="login-page">
  <button type="button" class="btn btn-outline-secondary login-theme" (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a modo día' : 'Cambiar a modo noche'">
    <i class="bi" [class.bi-sun]="theme.theme() === 'dark'" [class.bi-moon-stars]="theme.theme() !== 'dark'"></i>
  </button>

  <div class="card login-card">
    <div class="card-body p-4 p-sm-5">
      <div class="login-brand">
        <i class="bi bi-egg-fried" aria-hidden="true"></i>
        <span>Restaurante Master</span>
      </div>
      <h1 class="h4 mb-1">Iniciar sesión</h1>
      <p class="text-muted mb-4">Entra con tu usuario del restaurante.</p>

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control" formControlName="username"
                 autocomplete="username" autocapitalize="none" spellcheck="false" autofocus
                 [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid">
          <div class="invalid-feedback">Escribe tu usuario.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" formControlName="password"
                   [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
                   [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword.set(!showPassword())"
                    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [class.bi-eye-slash]="showPassword()" [class.bi-eye]="!showPassword()"></i>
            </button>
            <div class="invalid-feedback">Escribe tu contraseña.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>Entrando...
          } @else {
            Entrar
          }
        </button>
      </form>
    </div>
  </div>
</div>
