<div class="card mx-auto" style="max-width: 600px;">
  <div class="card-header">
    <h4>
      <i class="bi me-2" [class.bi-plus-circle]="!isEditMode()" [class.bi-pencil-square]="isEditMode()"></i>
      {{ isEditMode() ? 'Editar plato' : 'Nuevo plato' }}
    </h4>
  </div>
  <div class="card-body p-4">
    @if (error()) {
      <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row g-3">
        <div class="col-12">
          <label for="m-name" class="form-label fw-semibold">Nombre</label>
          <input id="m-name" type="text" class="form-control" formControlName="name"
                 [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid">
        </div>

        <div class="col-md-6">
          <label for="m-price" class="form-label fw-semibold">Precio</label>
          <input id="m-price" type="number" min="0.01" step="0.01" class="form-control" formControlName="price"
                 [class.is-invalid]="form.controls.price.touched && form.controls.price.invalid">
        </div>

        <div class="col-md-6">
          <label for="m-category" class="form-label fw-semibold">Categoría</label>
          <select id="m-category" class="form-select" formControlName="category">
            @for (c of categories; track c) {
              <option [ngValue]="c">{{ categoryLabels[c] }}</option>
            }
          </select>
        </div>

        <div class="col-12">
          <label for="m-description" class="form-label fw-semibold">Descripción <span class="text-muted">(opcional)</span></label>
          <textarea id="m-description" class="form-control" rows="3" formControlName="description"></textarea>
        </div>


        <div class="col-12">
          <div class="form-check form-switch">
            <input id="m-available" class="form-check-input" type="checkbox" formControlName="isAvailable">
            <label for="m-available" class="form-check-label">Disponible para pedir</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a routerLink="/menu" class="btn btn-outline-secondary px-4">Cancelar</a>
        <button type="submit" class="btn btn-primary px-4" [disabled]="saving()">
          <i class="bi bi-save me-2"></i>Guardar
        </button>
      </div>
    </form>
  </div>
</div>
